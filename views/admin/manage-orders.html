<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Orders | Nature Mist Admin</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background: #f5f0fb; min-height: 100vh; }
    .admin-layout { display: flex; min-height: 100vh; }
    .admin-sidebar {
      width: 240px;
      background: linear-gradient(180deg, #2d1b4e 0%, #4a3570 100%);
      color: #fff; flex-shrink: 0; display: flex; flex-direction: column;
      position: fixed; top:0; left:0; bottom:0; z-index:100;
    }
    .sidebar-logo { padding: 1.8rem 1.5rem; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .sidebar-logo h2 { font-family: 'Playfair Display', serif; font-size: 1.2rem; margin:0; display:flex; align-items:center; gap:8px; }
    .sidebar-logo p { font-size:0.75rem; opacity:0.6; margin:4px 0 0; }
    .sidebar-nav { flex:1; padding:1rem 0; }
    .nav-section-title { padding:0.6rem 1.5rem; font-size:0.7rem; text-transform:uppercase; letter-spacing:0.08em; opacity:0.4; margin-top:0.5rem; }
    .nav-item { display:flex; align-items:center; gap:12px; padding:0.85rem 1.5rem; color:rgba(255,255,255,0.75); text-decoration:none; font-size:0.9rem; font-weight:500; transition:all 0.2s; border-left:3px solid transparent; }
    .nav-item:hover, .nav-item.active { background:rgba(255,255,255,0.1); color:#fff; border-left-color:var(--lavender); }
    .nav-item i { width:18px; text-align:center; }
    .sidebar-footer { padding:1.2rem 1.5rem; border-top:1px solid rgba(255,255,255,0.1); }
    .logout-btn { display:flex; align-items:center; gap:10px; background:rgba(255,255,255,0.1); color:rgba(255,255,255,0.8); border:1px solid rgba(255,255,255,0.15); border-radius:var(--radius-sm); padding:0.7rem 1rem; font-size:0.85rem; cursor:pointer; width:100%; transition:all 0.2s; }
    .logout-btn:hover { background:rgba(239,68,68,0.2); border-color:rgba(239,68,68,0.4); color:#fca5a5; }
    .admin-main { margin-left:240px; flex:1; padding:2rem; }
    .admin-topbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:2rem; flex-wrap:wrap; gap:1rem; }
    .admin-topbar h1 { font-family:'Playfair Display',serif; color:var(--brown); font-size:1.5rem; margin:0; }
    .admin-card { background:#fff; border-radius:var(--radius); box-shadow:var(--shadow); border:1px solid var(--border); overflow:hidden; }
    .admin-table { width:100%; border-collapse:collapse; }
    .admin-table th { padding:0.9rem 1.2rem; text-align:left; font-size:0.75rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-muted); background:#fafafa; border-bottom:1px solid var(--border); white-space:nowrap; }
    .admin-table td { padding:0.9rem 1.2rem; border-bottom:1px solid var(--lavender-light); font-size:0.87rem; vertical-align:middle; }
    .admin-table tr:last-child td { border-bottom:none; }
    .admin-table tr:hover td { background:#fafafa; }
    .status-badge { padding:0.3rem 0.75rem; border-radius:999px; font-size:0.75rem; font-weight:600; text-transform:capitalize; }
    .status-pending { background:#fef3c7; color:#d97706; }
    .status-confirmed { background:#dbeafe; color:#2563eb; }
    .status-shipped { background:#ede9fe; color:#7c3aed; }
    .status-delivered { background:#dcfce7; color:#16a34a; }
    .status-cancelled { background:#fee2e2; color:#dc2626; }

    /* Filter tabs */
    .status-tabs { display:flex; gap:0.5rem; padding:1rem 1.5rem; border-bottom:1px solid var(--border); flex-wrap:wrap; }
    .tab-btn {
      padding:0.4rem 1rem;
      border:1.5px solid var(--border);
      border-radius:999px;
      font-size:0.82rem;
      font-weight:600;
      cursor:pointer;
      background:#fff;
      color:var(--text-muted);
      transition:all 0.2s;
    }
    .tab-btn:hover { border-color:var(--lavender-dark); color:var(--lavender-dark); }
    .tab-btn.active { background:var(--lavender-dark); color:#fff; border-color:var(--lavender-dark); }

    /* Order detail modal */
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:1000; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity 0.3s; padding:1rem; }
    .modal-overlay.show { opacity:1; pointer-events:all; }
    .modal { background:#fff; border-radius:var(--radius); max-width:600px; width:100%; max-height:90vh; overflow-y:auto; box-shadow:0 25px 60px rgba(0,0,0,0.2); transform:translateY(30px); transition:transform 0.3s; }
    .modal-overlay.show .modal { transform:translateY(0); }
    .modal-header { padding:1.5rem; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
    .modal-header h2 { font-family:'Playfair Display',serif; color:var(--brown); font-size:1.2rem; margin:0; }
    .modal-body { padding:1.5rem; }
    .close-btn { background:none; border:none; font-size:1.3rem; cursor:pointer; color:var(--text-muted); }
    .close-btn:hover { color:var(--brown); }
    .detail-row { display:flex; justify-content:space-between; padding:0.6rem 0; border-bottom:1px solid var(--lavender-light); font-size:0.88rem; }
    .detail-row:last-child { border-bottom:none; }
    .detail-row span:first-child { color:var(--text-muted); }
    .detail-row span:last-child { font-weight:600; color:var(--brown); }
    .order-items-section { margin-top:1.5rem; }
    .order-item-row { display:flex; justify-content:space-between; align-items:center; padding:0.7rem 0; border-bottom:1px solid var(--lavender-light); font-size:0.88rem; }
    .order-item-row:last-child { border-bottom:none; }
    .status-select { padding:0.5rem 0.8rem; border:1.5px solid var(--lavender); border-radius:var(--radius-sm); background:#fff; font-size:0.85rem; cursor:pointer; font-weight:600; }
    .whatsapp-mini { background:linear-gradient(135deg,#25d366,#128c7e); color:#fff; border:none; padding:0.4rem 0.9rem; border-radius:999px; font-size:0.8rem; cursor:pointer; font-weight:600; text-decoration:none; display:inline-flex; align-items:center; gap:5px; }
    .search-bar { padding:1rem 1.5rem; border-bottom:1px solid var(--border); }
    .search-bar input { width:100%; padding:0.6rem 0.9rem; border:1.5px solid var(--border); border-radius:var(--radius-sm); font-size:0.88rem; }
    .search-bar input:focus { outline:none; border-color:var(--lavender-dark); }
  </style>
</head>
<body>
<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="sidebar-logo">
      <h2>🌿 Nature Mist</h2>
      <p>Admin Control Panel</p>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-title">Main</div>
      <a href="/naturemist-manage/dashboard" class="nav-item"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
      <div class="nav-section-title">Management</div>
      <a href="/naturemist-manage/products" class="nav-item"><i class="fas fa-soap"></i> Products</a>
      <a href="/naturemist-manage/orders" class="nav-item active"><i class="fas fa-shopping-bag"></i> Orders</a>
      <div class="nav-section-title">Configuration</div>
      <a href="/naturemist-manage/settings" class="nav-item"><i class="fas fa-cog"></i> Settings</a>
      <a href="/" class="nav-item" target="_blank"><i class="fas fa-store"></i> View Store</a>
    </nav>
    <div class="sidebar-footer">
      <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <div>
        <h1>Manage Orders</h1>
        <p style="color:var(--text-muted); margin:0; font-size:0.88rem;" id="order-count-msg">Loading orders...</p>
      </div>
    </div>

    <div class="admin-card">
      <div class="status-tabs">
        <button class="tab-btn active" data-status="all" onclick="setFilter('all', this)">All Orders</button>
        <button class="tab-btn" data-status="pending" onclick="setFilter('pending', this)">⏳ Pending</button>
        <button class="tab-btn" data-status="confirmed" onclick="setFilter('confirmed', this)">✅ Confirmed</button>
        <button class="tab-btn" data-status="shipped" onclick="setFilter('shipped', this)">🚚 Shipped</button>
        <button class="tab-btn" data-status="delivered" onclick="setFilter('delivered', this)">📦 Delivered</button>
        <button class="tab-btn" data-status="cancelled" onclick="setFilter('cancelled', this)">❌ Cancelled</button>
      </div>
      <div class="search-bar">
        <input type="text" id="order-search" placeholder="🔍  Search by customer name or order ID..." oninput="filterDisplay()">
      </div>
      <div style="overflow-x:auto;">
        <table class="admin-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Customer</th>
              <th>Phone</th>
              <th>Amount</th>
              <th>Items</th>
              <th>Date</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="orders-tbody">
            <tr><td colspan="8" style="text-align:center; padding:2rem; color:var(--text-muted);">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<!-- Order Detail Modal -->
<div class="modal-overlay" id="order-modal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-order-title">Order Details</h2>
      <button class="close-btn" onclick="document.getElementById('order-modal').classList.remove('show')">×</button>
    </div>
    <div class="modal-body" id="modal-order-body">Loading...</div>
  </div>
</div>

<script>
let allOrders = [];
let currentFilter = 'all';

async function checkAuth() {
  const res = await fetch('/api/admin/check');
  const d = await res.json();
  if (!d.isAdmin) window.location.href = '/naturemist-manage';
}

async function loadOrders() {
  try {
    const res = await fetch('/api/admin/orders');
    const data = await res.json();
    allOrders = data.orders || [];
    renderOrders();
  } catch (e) {
    document.getElementById('orders-tbody').innerHTML = '<tr><td colspan="8" style="text-align:center; padding:2rem; color:var(--text-muted);">Failed to load orders.</td></tr>';
  }
}

function setFilter(status, btn) {
  currentFilter = status;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderOrders();
}

function filterDisplay() {
  renderOrders();
}

function renderOrders() {
  const q = document.getElementById('order-search').value.toLowerCase();
  let filtered = allOrders;
  if (currentFilter !== 'all') filtered = filtered.filter(o => o.status === currentFilter);
  if (q) filtered = filtered.filter(o => o.customer_name.toLowerCase().includes(q) || String(o.id).includes(q));
  
  document.getElementById('order-count-msg').textContent = `${filtered.length} orders shown`;
  const tbody = document.getElementById('orders-tbody');
  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; padding:2rem; color:var(--text-muted);">No orders found.</td></tr>';
    return;
  }
  tbody.innerHTML = filtered.map(o => {
    const date = new Date(o.created_at).toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' });
    const itemCount = o.items ? o.items.length : 0;
    return `
      <tr>
        <td><strong>#${o.id}</strong></td>
        <td>
          <div style="font-weight:600; color:var(--brown);">${o.customer_name}</div>
          <div style="font-size:0.75rem; color:var(--text-muted);">${o.city || ''}</div>
        </td>
        <td>
          <a href="https://wa.me/${o.customer_phone ? '91'+o.customer_phone : ''}" target="_blank" class="whatsapp-mini">
            <i class="fab fa-whatsapp"></i> ${o.customer_phone || 'N/A'}
          </a>
        </td>
        <td><strong style="color:var(--brown);">₹${o.total_amount}</strong></td>
        <td>${itemCount} item${itemCount !== 1 ? 's' : ''}</td>
        <td style="font-size:0.8rem;">${date}</td>
        <td>
          <select class="status-select status-${o.status}" onchange="updateStatus(${o.id}, this.value, this)">
            <option value="pending" ${o.status==='pending'?'selected':''}>⏳ Pending</option>
            <option value="confirmed" ${o.status==='confirmed'?'selected':''}>✅ Confirmed</option>
            <option value="shipped" ${o.status==='shipped'?'selected':''}>🚚 Shipped</option>
            <option value="delivered" ${o.status==='delivered'?'selected':''}>📦 Delivered</option>
            <option value="cancelled" ${o.status==='cancelled'?'selected':''}>❌ Cancelled</option>
          </select>
        </td>
        <td>
          <button onclick="viewOrder(${o.id})" style="background:var(--lavender-light); color:var(--lavender-dark); border:none; padding:0.4rem 0.8rem; border-radius:6px; cursor:pointer; font-size:0.8rem; font-weight:600;">
            <i class="fas fa-eye"></i> View
          </button>
        </td>
      </tr>
    `;
  }).join('');
}

async function updateStatus(orderId, newStatus, selectEl) {
  const originalVal = selectEl.dataset.original || selectEl.value;
  try {
    const res = await fetch(`/api/admin/orders/${orderId}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: newStatus })
    });
    const data = await res.json();
    if (data.success) {
      // Update in-memory data
      const order = allOrders.find(o => o.id === orderId);
      if (order) order.status = newStatus;
      selectEl.className = `status-select status-${newStatus}`;
    } else {
      alert('Error: ' + data.message);
      selectEl.value = originalVal;
    }
  } catch (e) {
    alert('Connection error');
    selectEl.value = originalVal;
  }
}

function viewOrder(orderId) {
  const o = allOrders.find(or => or.id === orderId);
  if (!o) return;
  document.getElementById('modal-order-title').textContent = `Order #${o.id}`;
  const date = new Date(o.created_at).toLocaleString('en-IN');
  const whatsappMsg = encodeURIComponent(`Hi ${o.customer_name}! Your order #${o.id} from Nature Mist has been ${o.status}.`);
  const phone = o.customer_phone ? `91${o.customer_phone}` : '';
  document.getElementById('modal-order-body').innerHTML = `
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:1.5rem; margin-bottom:1.5rem;">
      <div>
        <h4 style="color:var(--lavender-dark); margin:0 0 0.8rem; font-size:0.85rem; text-transform:uppercase;">Customer Info</h4>
        <div class="detail-row"><span>Name</span><span>${o.customer_name}</span></div>
        <div class="detail-row"><span>Phone</span><span>${o.customer_phone || '—'}</span></div>
        <div class="detail-row"><span>Email</span><span>${o.customer_email || '—'}</span></div>
      </div>
      <div>
        <h4 style="color:var(--lavender-dark); margin:0 0 0.8rem; font-size:0.85rem; text-transform:uppercase;">Order Info</h4>
        <div class="detail-row"><span>Order Date</span><span>${date}</span></div>
        <div class="detail-row"><span>Payment</span><span>${o.payment_method?.toUpperCase() || 'COD'}</span></div>
        <div class="detail-row"><span>Status</span><span><span class="status-badge status-${o.status}">${o.status}</span></span></div>
      </div>
    </div>
    <div style="margin-bottom:1.5rem;">
      <h4 style="color:var(--lavender-dark); margin:0 0 0.8rem; font-size:0.85rem; text-transform:uppercase;">Shipping Address</h4>
      <p style="color:var(--brown); font-size:0.9rem; line-height:1.6; margin:0;">${o.customer_address || '—'}<br>${o.city || ''} ${o.pincode || ''}</p>
    </div>
    <div class="order-items-section">
      <h4 style="color:var(--lavender-dark); margin:0 0 0.8rem; font-size:0.85rem; text-transform:uppercase;">Order Items</h4>
      ${(o.items || []).map(item => `
        <div class="order-item-row">
          <div>
            <div style="font-weight:600; color:var(--brown);">${item.product_name}</div>
            <div style="font-size:0.78rem; color:var(--text-muted);">₹${item.price} × ${item.quantity}</div>
          </div>
          <strong style="color:var(--brown);">₹${item.price * item.quantity}</strong>
        </div>
      `).join('')}
      <div class="detail-row" style="margin-top:1rem; border-top:2px solid var(--lavender-light); padding-top:0.8rem;">
        <span style="font-weight:700;">Total</span>
        <span style="font-size:1.1rem; color:var(--lavender-dark);">₹${o.total_amount}</span>
      </div>
    </div>
    ${phone ? `
    <div style="margin-top:1.5rem;">
      <a href="https://wa.me/${phone}?text=${whatsappMsg}" target="_blank" class="whatsapp-mini" style="padding:0.7rem 1.2rem; font-size:0.9rem; border-radius:var(--radius-sm);">
        <i class="fab fa-whatsapp" style="font-size:1.1rem;"></i> Contact Customer on WhatsApp
      </a>
    </div>` : ''}
  `;
  document.getElementById('order-modal').classList.add('show');
}

async function logout() {
  await fetch('/api/admin/logout', { method: 'POST' });
  window.location.href = '/naturemist-manage';
}

checkAuth().then(loadOrders);
</script>
</body>
</html>
