<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Nature Mist</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #2d1b4e 0%, #4a3570 40%, #7c6fa0 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: rgba(255,255,255,0.97);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.3);
      text-align: center;
      animation: cardIn 0.6s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes cardIn {
      from { transform: translateY(40px) scale(0.95); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }
    .admin-logo {
      width: 72px; height: 72px;
      background: linear-gradient(135deg, var(--lavender-dark), #4a3570);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.5rem;
      font-size: 1.8rem;
      box-shadow: 0 8px 25px rgba(124,111,160,0.4);
    }
    .login-card h1 {
      font-family: 'Playfair Display', serif;
      color: var(--brown);
      font-size: 1.6rem;
      margin-bottom: 0.3rem;
    }
    .login-card p {
      color: var(--text-muted);
      margin-bottom: 2rem;
      font-size: 0.9rem;
    }
    .form-group { text-align: left; margin-bottom: 1.2rem; }
    .input-icon-wrap { position: relative; }
    .input-icon-wrap i {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      color: var(--lavender-dark); font-size: 0.9rem;
    }
    .input-icon-wrap input {
      padding-left: 40px;
      width: 100%;
    }
    .login-btn {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, var(--lavender-dark), #4a3570);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      letter-spacing: 0.03em;
    }
    .login-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(74,53,112,0.35); }
    .login-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
    .error-msg {
      background: #fef2f2; border: 1px solid #fca5a5;
      color: #dc2626; padding: 0.8rem; border-radius: var(--radius-sm);
      font-size: 0.9rem; margin-bottom: 1rem; display: none;
    }
    .back-link { margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-muted); }
    .back-link a { color: var(--lavender-dark); text-decoration: none; font-weight: 600; }
    .particles-bg { position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }
    .login-card { position: relative; z-index: 1; }
    .floating-leaf {
      position: absolute;
      font-size: 1.5rem;
      animation: floatLeaf linear infinite;
      opacity: 0.3;
    }
    @keyframes floatLeaf {
      from { transform: translateY(100vh) rotate(0deg); }
      to { transform: translateY(-100px) rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="particles-bg" id="particles"></div>

  <div class="login-card">
    <div class="admin-logo">🌿</div>
    <h1>Admin Panel</h1>
    <p>Sign in to manage your Nature Mist store</p>

    <div class="error-msg" id="error-msg">
      <i class="fas fa-exclamation-circle"></i> <span id="error-text">Invalid credentials</span>
    </div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label">Username</label>
        <div class="input-icon-wrap">
          <i class="fas fa-user"></i>
          <input type="text" id="username" class="form-control" placeholder="Enter admin username" required autocomplete="username">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-icon-wrap">
          <i class="fas fa-lock"></i>
          <input type="password" id="password" class="form-control" placeholder="Enter password" required autocomplete="current-password">
          <i class="fas fa-eye" id="toggle-pw" style="left:auto; right:14px; cursor:pointer; color:var(--text-muted);" onclick="togglePassword()"></i>
        </div>
      </div>

      <button type="submit" class="login-btn" id="login-btn">
        <i class="fas fa-sign-in-alt"></i> Sign In
      </button>
    </form>

    <div class="back-link">
      <a href="/"><i class="fas fa-arrow-left"></i> Back to Store</a>
    </div>
  </div>

  <script>
    // Floating leaves animation
    const emojis = ['🌿','🍃','🌸','✨'];
    const bg = document.getElementById('particles');
    for (let i = 0; i < 12; i++) {
      const leaf = document.createElement('div');
      leaf.className = 'floating-leaf';
      leaf.textContent = emojis[i % emojis.length];
      leaf.style.cssText = `
        left: ${Math.random() * 100}vw;
        animation-duration: ${6 + Math.random() * 8}s;
        animation-delay: ${-Math.random() * 10}s;
        font-size: ${1 + Math.random()}rem;
      `;
      bg.appendChild(leaf);
    }

    function togglePassword() {
      const pw = document.getElementById('password');
      const icon = document.getElementById('toggle-pw');
      if (pw.type === 'password') {
        pw.type = 'text';
        icon.className = 'fas fa-eye-slash';
        icon.style.cssText = 'position:absolute; left:auto; right:14px; top:50%; transform:translateY(-50%); cursor:pointer; color:var(--lavender-dark);';
      } else {
        pw.type = 'password';
        icon.className = 'fas fa-eye';
        icon.style.cssText = 'position:absolute; left:auto; right:14px; top:50%; transform:translateY(-50%); cursor:pointer; color:var(--text-muted);';
      }
    }

    // Check if already logged in
    fetch('/api/admin/check').then(r => r.json()).then(d => {
      if (d.isAdmin) window.location.href = '/naturemist-manage/dashboard';
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      const errEl = document.getElementById('error-msg');
      const errTxt = document.getElementById('error-text');
      errEl.style.display = 'none';
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        if (data.success) {
          btn.innerHTML = '<i class="fas fa-check"></i> Success! Redirecting...';
          btn.style.background = 'linear-gradient(135deg, #8aab8a, #5e9e5e)';
          setTimeout(() => window.location.href = '/naturemist-manage', 800);
        } else {
          errTxt.textContent = data.message || 'Invalid credentials';
          errEl.style.display = 'block';
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
          document.getElementById('password').value = '';
          document.getElementById('password').focus();
        }
      } catch (err) {
        errTxt.textContent = 'Connection error. Please try again.';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
      }
    });
  </script>
</body>
</html>
