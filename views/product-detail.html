<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details | Nature Mist</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <nav class="navbar">
    <div class="container" style="max-width:1200px; margin:0 auto; padding:0 20px; display:flex; justify-content:space-between; align-items:center;">
      <a href="/" class="nav-brand"><span>🌿</span> Nature Mist</a>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/products">Shop All</a></li>
        <li>
          <a href="/cart" class="cart-icon">
            <i class="fa-solid fa-basket-shopping" style="color:var(--lavender-dark)"></i>
            <span class="cart-badge" id="cart-badge">0</span>
          </a>
        </li>
      </ul>
    </div>
  </nav>

  <div class="container" style="max-width:1200px; margin:0 auto; padding:2rem 20px;">
    
    <div class="breadcrumb" id="breadcrumb">
      <a href="/">Home</a> <span>/</span> <a href="/products">Shop</a> <span>/</span> <span id="bc-name">...</span>
    </div>

    <div id="product-container" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(350px, 1fr)); gap:3rem; margin-bottom:4rem;">
      <div class="skeleton" style="height:400px; border-radius:var(--radius);"></div>
      <div class="skeleton" style="height:400px; border-radius:var(--radius);"></div>
    </div>

    <div class="divider" style="margin:4rem auto 2rem;"></div>
    
    <h3 class="section-title" style="font-size:1.5rem;">You May Also Like</h3>
    <div id="related-products" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:2rem; margin-top:2rem;">
      <!-- Related injected here -->
    </div>

  </div>

  <footer class="footer">
    <div class="container" style="max-width:1200px; margin:0 auto; padding:0 20px; display:flex; align-items:center; justify-content:center; gap:1rem;">
      <p style="margin:0;">&copy; 2024 Nature Mist. All rights reserved.</p>
      <a href="/naturemist-manage" title="" style="color:rgba(255,255,255,0.15); font-size:0.75rem; text-decoration:none; transition:color 0.3s;" onmouseover="this.style.color='rgba(255,255,255,0.5)'" onmouseout="this.style.color='rgba(255,255,255,0.15)'">
        <i class="fas fa-lock"></i>
      </a>
    </div>
  </footer>

  <script src="/js/main.js"></script>
  <script>
    const id = window.location.pathname.split('/').pop();
    
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await fetch(`/api/products/${id}`);
        const data = await res.json();
        
        if (!data.success) {
          document.getElementById('product-container').innerHTML = `
            <div class="empty-state" style="grid-column:1/-1;">
              <div class="icon">😢</div>
              <h3>Product Not Found</h3>
              <p>The product you are looking for does not exist or has been removed.</p>
              <a href="/products" class="btn-primary" style="margin-top:1rem;">Back to Shop</a>
            </div>
          `;
          return;
        }

        const p = data.product;
        document.title = `${p.name} | Nature Mist`;
        document.getElementById('bc-name').textContent = p.name;

        const container = document.getElementById('product-container');
        container.innerHTML = `
          <div style="background:var(--lavender-light); border-radius:var(--radius); overflow:hidden; display:flex; align-items:center; justify-content:center; min-height:400px; font-size:5rem;">
            🧼
          </div>
          <div>
            <div class="product-category" style="font-size:0.85rem; margin-bottom:0.5rem;">${p.category}</div>
            <h1 style="font-size:2.2rem; font-family:'Playfair Display', serif; color:var(--brown); margin-bottom:0.5rem;">${p.name}</h1>
            
            <div style="display:flex; align-items:center; gap:10px; margin-bottom:1.5rem;">
              <span style="font-size:1.5rem; font-weight:700; color:var(--lavender-dark);">₹${p.price}</span>
              ${p.original_price ? `<span style="font-size:1rem; color:#aaa; text-decoration:line-through;">₹${p.original_price}</span>` : ''}
              ${p.original_price ? `<span style="background:#e8847a; color:white; padding:2px 8px; border-radius:12px; font-size:0.75rem; font-weight:700;">SAVE ₹${p.original_price - p.price}</span>` : ''}
            </div>
            
            <p style="color:var(--text-muted); font-size:1.05rem; margin-bottom:2rem; line-height:1.7;">${p.description}</p>
            
            <div style="background:var(--warm-white); padding:1.5rem; border-radius:var(--radius-sm); border:1px solid var(--border); margin-bottom:2rem;">
              <div style="display:grid; grid-template-columns:100px 1fr; gap:0.5rem; font-size:0.9rem;">
                <strong style="color:var(--brown-light);">Weight:</strong> <span>${p.weight || 'N/A'}</span>
                <strong style="color:var(--brown-light);">Key Benefits:</strong> <span>${p.benefits || 'N/A'}</span>
                <strong style="color:var(--brown-light);">Ingredients:</strong> <span>${p.ingredients || 'N/A'}</span>
              </div>
            </div>

            <div style="display:flex; align-items:center; gap:1rem; margin-bottom:1.5rem;">
              <div class="qty-control" style="background:white; border:1px solid var(--border); border-radius:25px; padding:0.4rem 0.5rem;">
                <button class="qty-btn" style="border:none; border-radius:50%;" onclick="adjustQty(-1)">-</button>
                <span id="detail-qty" style="width:30px; text-align:center; font-weight:600;">1</span>
                <button class="qty-btn" style="border:none; border-radius:50%;" onclick="adjustQty(1)">+</button>
              </div>
              <p style="font-size:0.85rem; color:${p.stock > 0 ? 'var(--sage)' : '#e8847a'}; margin:0;">
                ${p.stock > 0 ? `In Stock (${p.stock} left)` : 'Out of Stock'}
              </p>
            </div>

            <button class="btn-primary" style="width:100%; justify-content:center; padding:1rem; font-size:1.05rem;" 
              ${p.stock <= 0 ? 'disabled' : ''} 
              onclick="addCurrentToCart()">
              ${p.stock > 0 ? '<i class="fa-solid fa-cart-plus"></i> Add to Cart' : 'Out of Stock'}
            </button>
          </div>
        `;

        // Load related
        const relContainer = document.getElementById('related-products');
        if(data.related && data.related.length > 0) {
          data.related.forEach(rp => {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
              <div class="product-img">
                <a href="/product/${rp.id}"><div style="width:100%; height:100%; background:#e8e0f5; display:flex; align-items:center; justify-content:center; font-size:3rem;">🧼</div></a>
              </div>
              <div class="product-body">
                <h3 class="product-name"><a href="/product/${rp.id}">${rp.name}</a></h3>
                <div class="product-price">
                  <span class="price-current">₹${rp.price}</span>
                </div>
              </div>
            `;
            relContainer.appendChild(card);
          });
        } else {
          relContainer.innerHTML = '<p>No related products found.</p>';
        }

      } catch (e) {
        document.getElementById('product-container').innerHTML = '<p>Error loading product.</p>';
      }
    });

    let qty = 1;
    function adjustQty(change) {
      qty = Math.max(1, qty + change);
      document.getElementById('detail-qty').textContent = qty;
    }

    function addCurrentToCart() {
      addToCart(id, qty, event.target);
    }
  </script>
</body>
</html>
